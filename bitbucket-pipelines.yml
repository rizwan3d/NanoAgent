image: ubuntu:24.04

clone:
  depth: full

pipelines:
  pull-requests:
    "**":
      - step:
          name: stemcode PR review
          script:
            - apt-get update
            - apt-get install -y --no-install-recommends bash ca-certificates curl git python3
            - curl -fsSL https://raw.githubusercontent.com/rizwan3d/StemCode/master/scripts/install.sh | bash
            - bash .bitbucket/stemcode-bitbucket-review.sh
          artifacts:
            - artifacts/stemcode-review/**
